services:

  db_postgres:
    image: postgres:14.3-alpine3.15
    ports:
      - "5432:5432"
    environment:

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 20s
      retries: 5

  server:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db_postgres:
        condition: service_healthy
    env_file:
      - .env
    command: >
      bash -c "python3 migrate.py && uvicorn app:app --host 0.0.0.0 --port 8080"